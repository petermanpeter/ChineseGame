<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donkey Kong 找中文字</title>
    <style>
        :root {
            --mario-sky: #5c94fc;
            --mario-ground: #00a800;
            --brick-brown: #bc5c14;
            --pipe-green: #00b000;
            --coin-yellow: #f8b800;
            --sky-blue: #87CEEB;
            --dk-orange: #d96b27;
            --dk-brown: #5c3a21;
            --asphalt: #444444;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, var(--mario-sky) 0%, #7ec0ee 60%, #bce6ff 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin: 5px 0 15px 0;
            letter-spacing: 3px;
            line-height: 1.1;
            text-align: center;
            text-shadow: 2px 2px #000000, 4px 4px var(--dk-brown);
        }

        .title-letter:nth-child(6n + 1) { color: #ff3333; }
        .title-letter:nth-child(6n + 2) { color: #ff9f1c; }
        .title-letter:nth-child(6n + 3) { color: #ffe600; }
        .title-letter:nth-child(6n + 4) { color: #35d04f; }
        .title-letter:nth-child(6n + 5) { color: #3399ff; }
        .title-letter:nth-child(6n) { color: #b45cff; }

        .aerial-kart-card {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 120px;
            height: 120px;
            overflow: hidden;
            border: 3px solid #5c3a21;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
            z-index: 20;
            padding: 0;
            cursor: pointer;
        }

        .aerial-kart-card img,
        .kart-back-view {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .character-selector {
            box-sizing: border-box;
            width: min(360px, calc(100vw - 40px));
            padding: 20px;
            border: 4px solid #5c3a21;
            border-radius: 12px;
            background: #6ab0de;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #fff;
            font: inherit;
        }

        .character-selector::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        .character-selector h2 {
            margin: 0 0 15px;
            text-align: center;
            text-shadow: 1px 1px #000;
        }

        .character-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .character-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px;
            border: 3px solid #996600;
            border-radius: 8px;
            background: #ffcc00;
            color: #332200;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .character-option img {
            width: 76px;
            height: 76px;
            object-fit: contain;
        }

        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .track-scene {
            width: 450px;
            height: 500px;
            perspective: 400px;
            position: relative;
            overflow: hidden;
            border: 8px solid #888;
            border-radius: 12px;
            background: linear-gradient(to bottom, #87CEEB 0%, #a2d8f0 30%, var(--mario-ground) 30%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .track-container {
            width: 120%;
            height: 200%;
            background: var(--asphalt);
            position: absolute;
            bottom: -10%;
            transform-origin: bottom center;
            transform: rotateX(65deg);
            border-left: 25px solid #ccc;
            border-right: 25px solid #ccc;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        }

        .road-lines {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 300%;
            top: -100%;
            background: repeating-linear-gradient(to bottom, #ffffff 0, #ffffff 80px, transparent 80px, transparent 160px);
            z-index: 1;
        }

        .obstacle {
            position: absolute;
            font-size: 3.5rem;
            z-index: 2;
            transform-origin: bottom center;
            transform: translateX(-50%) rotateX(-65deg); 
            filter: drop-shadow(2px 10px 5px rgba(0,0,0,0.5));
        }

        .banana-peel { width: 64px; height: 60px; object-fit: contain; }

        #dk-kart {
            position: absolute;
            left: 50%;
            transform: translateX(calc(-50% + var(--kart-offset, 0px)));
            bottom: 30px;
            width: 145px;
            height: 155px;
            z-index: 10;
        }

        .flame {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 25px;
            background: linear-gradient(to bottom, yellow, orange, red, transparent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }

        .ui-container {
            flex-grow: 1;
            background: #6ab0de;
            padding: 20px;
            border-radius: 12px;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 700px;
        }

        .stage-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .stage-btn {
            background: #c8e8f5;
            border: 2px solid #5b9bb8;
            padding: 6px 8px;
            border-radius: 5px;
            color: #17445a;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 0 #477d96;
            font-size: 0.85rem;
            transition: 0.1s;
        }
        
        .stage-btn.active, .stage-btn:hover {
            background: #4b91ad;
            border-color: #326d85;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #28576b;
        }

        .pause-btn {
            background: #d7e8ef;
            border: 2px solid #5b9bb8;
            padding: 6px 8px;
            border-radius: 5px;
            color: #17445a;
            font: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #477d96;
            transition: 0.1s;
        }

        .pause-btn.paused {
            background: #f2c85b;
            border-color: #9b7415;
            color: #4d3907;
            box-shadow: 0 4px 0 #76580d;
        }

        .elapsed-time {
            padding: 6px 8px;
            border: 2px solid #5b9bb8;
            border-radius: 5px;
            background: #c8e8f5;
            color: #17445a;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px #000;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 8px;
        }

        .correct-count { color: #00ff66; }
        .incorrect-count { color: #ff6666; }

        .speed-stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-meter {
            width: clamp(50px, 7vw, 90px);
            height: 12px;
            overflow: hidden;
            border: 2px solid #fff;
            border-radius: 5px;
            background: #333;
            transition: background-color 0.1s linear;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        .speed-meter-fill {
            width: 0;
            height: 100%;
            background-color: #fff4cc;
            transition: width 0.1s linear, background-color 0.1s linear;
        }

        .typing-prompt-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .steering-control {
            box-sizing: border-box;
            flex: 0 0 64px;
            height: 88px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px;
            background: #e6a800;
            border: 3px solid #996600;
            border-radius: 8px;
            cursor: pointer;
        }

        .steering-control.active {
            border: 4px solid #003b8f;
            box-shadow: 0 0 8px rgba(0, 59, 143, 0.8);
        }

        .steering-arrow {
            display: block;
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        /* 找中文字區塊 */
        .word-board {
            flex: 1;
            background: #5c3a21;
            border: 4px solid #362112;
            padding: 20px;
            border-radius: 8px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            min-height: 300px;
            align-items: center;
        }

        .yellow-square {
            background-color: #ffcc00;
            color: #332200;
            font-size: 1.47rem;
            font-weight: bold;
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            width: 56px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #996600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #996600, 0 8px 10px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .yellow-square:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #996600, 0 3px 5px rgba(0,0,0,0.4);
        }

        .yellow-square.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .stall-warning {
            color: #ff3333;
            font-weight: bold;
            font-size: 0.65rem;
            animation: blink 0.3s infinite alternate;
        }
        
        @keyframes blink { from { opacity: 1; } to { opacity: 0.2; } }

        .congrats-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #d9381e;
            border: 4px solid #fff;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            text-shadow: 2px 2px #000;
        }
        
        .congrats-msg.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <button class="aerial-kart-card" id="open-car-selector" type="button" aria-label="Choose a character">
        <img id="selected-kart-preview" src="Toad_aerial.jpeg" alt="Toad">
    </button>
    <dialog class="character-selector" id="character-selector" aria-labelledby="character-selector-title">
        <h2 id="character-selector-title">Choose a character</h2>
        <div class="character-options">
            <button class="character-option" type="button" data-image="DonkeyKong_kart_back.png" data-name="Donkey Kong">
                <img src="DonkeyKong_kart_back.png" alt="">
                <span>Donkey Kong</span>
            </button>
            <button class="character-option" type="button" data-image="Toad_car_transparent.png" data-name="Toad">
                <img src="Toad_car_transparent.png" alt="">
                <span>Toad</span>
            </button>
            <button class="character-option" type="button" data-image="Rosalina_car_transparent.png" data-name="Rosalina">
                <img src="Rosalina_car_transparent.png" alt="">
                <span>Rosalina</span>
            </button>
            <button class="character-option" type="button" data-image="Mario_car_transparent.png" data-name="Mario">
                <img src="Mario_car_transparent.png" alt="">
                <span>Mario</span>
            </button>
        </div>
    </dialog>

    <h1><span class="title-letter">找</span><span class="title-letter">中</span><span class="title-letter">文</span><span class="title-letter">字</span> <span class="title-letter">G</span><span class="title-letter">a</span><span class="title-letter">m</span><span class="title-letter">e</span></h1>

    <div class="game-layout">
        
        <!-- 3D 賽道場景區 -->
        <div class="track-scene">
            <div class="track-container" id="track-container">
                <div class="road-lines" id="road-lines"></div>
                <div id="obstacles-layer"></div>
            </div>
            
            <div id="dk-kart">
                <img class="kart-back-view" id="selected-character" src="DonkeyKong_kart_back.png" alt="Donkey Kong">
                <div class="flame" id="kart-flame"></div>
            </div>
            
            <div id="congrats-msg" class="congrats-msg">🏆 關卡完成！ 🍌</div>
        </div>

        <!-- UI區 -->
        <div class="ui-container">
            <div class="stage-selector">
                <button class="stage-btn active" onclick="setStage(1)">Level 1</button>
                <button class="stage-btn" onclick="setStage(2)">Level 2</button>
                <button class="stage-btn" onclick="setStage(3)">Level 3</button>
                <button class="stage-btn" onclick="setStage(4)">Level 4</button>
                <button class="pause-btn" id="pause-button" type="button" aria-pressed="false">Pause</button>
                <span class="elapsed-time" id="elapsed-time" role="timer" aria-label="Elapsed time">T: 0s</span>
            </div>

            <div class="stats">
                <div class="speed-stat">
                    <span>⚡ 時速:</span>
                    <div class="speed-meter" id="speed-meter" role="progressbar" aria-label="Speed" aria-valuemin="0" aria-valuemax="175" aria-valuenow="0" aria-valuetext="0 km/h">
                        <div class="speed-meter-fill" id="speed-meter-fill"></div>
                    </div>
                    <span id="status-text"></span>
                </div>
                <div><span class="correct-count">✅ 正確: <span id="correct-count">0</span></span>　<span class="incorrect-count">❌ 錯誤: <span id="incorrect-count">0</span></span></div>
                <div>🎯 準確率: <span id="accuracy">100</span>%</div>
            </div>

            <div class="typing-prompt-controls">
                <button class="steering-control" id="steer-left" type="button" aria-label="Steer left">
                    <img class="steering-arrow" src="arrow-left.png" alt="">
                </button>
                
                <!-- 新增：中文字方塊顯示區 -->
                <div id="word-board" class="word-board">
                    <!-- 字塊會由 JavaScript 動態生成 -->
                </div>

                <button class="steering-control" id="steer-right" type="button" aria-label="Steer right">
                    <img class="steering-arrow" src="arrow-right.png" alt="">
                </button>
            </div>
        </div>
    </div>

    <script>
        // 備用中文字庫（防止沒有架設 Server 時 CSV 讀取失敗）
        const fallbackWords = {
            1: ["我", "你", "他", "的", "是", "在", "不", "了", "有", "和"],
            2: ["天", "地", "玄", "黃", "宇", "宙", "洪", "荒", "日", "月"],
            3: ["春", "夏", "秋", "冬", "風", "雨", "雷", "電", "冰", "雪"],
            4: ["金", "木", "水", "火", "土", "山", "川", "河", "海", "林"]
        };

        let currentStage = 1;
        let currentLevelWords = [];
        let remainingWords = [];
        let targetWord = "";
        
        let totalClicks = 0;
        let correctClicks = 0;
        let incorrectClicks = 0;
        let speechInterval = null;
        let isPaused = false;
        let victoryTimeout = null;
        let victoryDeadline = 0;
        let victoryTimeRemaining = 0;

        // 物理變數
        let targetVelocity = 0;    
        let kartVelocity = 0;      
        let roadOffset = 0;        
        let kartOffset = 0;
        let steeringVelocity = 0;
        let steeringDirection = 0;
        let kartVerticalOffset = 0;
        let kartVerticalVelocity = 0;
        let elapsedGameSeconds = 0;
        let isGameStarted = false;
        let previousFrameTime = 0;
        let animationFrameId = null;
        let baseKartY = 30;        
        const maxVelocity = 25;    
        const maxSteeringVelocity = 240;
        const steeringAcceleration = 1100;
        const steeringFriction = 500;
        const steeringImpulse = maxSteeringVelocity;
        const kartVerticalImpulse = 420;
        const kartVerticalSpring = 64;
        const kartVerticalDamping = 14;
        
        // DOM Elements
        // DOM Elements
        const speedMeterFill = document.getElementById("speed-meter-fill");
        const pauseButton = document.getElementById("pause-button");
        const elapsedTime = document.getElementById("elapsed-time");
        const statusText = document.getElementById("status-text");
        const trackScene = document.querySelector(".track-scene");
        const accuracyEl = document.getElementById("accuracy");
        const correctCountEl = document.getElementById("correct-count");
        const incorrectCountEl = document.getElementById("incorrect-count");
        const roadLines = document.getElementById("road-lines");
        const dkKart = document.getElementById("dk-kart");
        const flameEffect = document.getElementById("kart-flame");
        const steerLeft = document.getElementById("steer-left");
        const steerRight = document.getElementById("steer-right");
        const obstaclesLayer = document.getElementById("obstacles-layer");
        const congratsMsg = document.getElementById("congrats-msg");
        const wordBoard = document.getElementById("word-board");
        const characterSelector = document.getElementById("character-selector");
        const openCharacterSelector = document.getElementById("open-car-selector");
        const selectedCharacter = document.getElementById("selected-character");

        let activeObstacles = [];
        let audioContext;

        pauseButton.addEventListener("click", togglePause);
        openCharacterSelector.addEventListener("click", () => characterSelector.showModal());
        characterSelector.querySelectorAll(".character-option").forEach(option => {
            option.addEventListener("click", () => {
                selectedCharacter.src = option.dataset.image;
                selectedCharacter.alt = option.dataset.name;
                characterSelector.close();
            });
        });

        characterSelector.addEventListener("click", event => {
            if (event.target === characterSelector) characterSelector.close();
        });

        function playWaterDrop() {
            audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === "suspended") audioContext.resume();
            const startTime = audioContext.currentTime;
            const drop = audioContext.createOscillator();
            const dropGain = audioContext.createGain();
            drop.type = "sine";
            drop.frequency.setValueAtTime(1180, startTime);
            drop.frequency.exponentialRampToValueAtTime(520, startTime + 0.22);
            dropGain.gain.setValueAtTime(0.0001, startTime);
            dropGain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.005);
            dropGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.24);
            drop.connect(dropGain);
            dropGain.connect(audioContext.destination);
            drop.start(startTime);
            drop.stop(startTime + 0.25);
        }

        function playSound(isCorrect) {
            if (isCorrect) { playWaterDrop(); return; }
            audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === "suspended") audioContext.resume();
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startTime = audioContext.currentTime;
            const duration = 0.2;
            oscillator.type = "sawtooth";
            oscillator.frequency.setValueAtTime(120, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(60, startTime + duration);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.2, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function speakTargetWord() {
            if (!targetWord) return;
            const msg = new SpeechSynthesisUtterance(targetWord);
            msg.lang = 'zh-HK'; // 粵語
            window.speechSynthesis.speak(msg);
        }

        function speakAnnouncement(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "zh-HK";
            window.speechSynthesis.speak(msg);
        }

        function startPronunciationLoop() {
            clearInterval(speechInterval);
            if (isPaused || remainingWords.length === 0) return;
            speakTargetWord();
            // 每4秒重複發音
            speechInterval = setInterval(speakTargetWord, 4000);
        }

        function scheduleVictoryTransition() {
            if (isPaused || victoryTimeout !== null) return;
            victoryDeadline = Date.now() + victoryTimeRemaining;
            victoryTimeout = setTimeout(() => {
                victoryTimeout = null;
                victoryTimeRemaining = 0;
                congratsMsg.classList.remove("show");
                targetVelocity = 0;
                setStage(currentStage === 4 ? 1 : currentStage + 1);
            }, victoryTimeRemaining);
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseButton.classList.toggle("paused", isPaused);
            pauseButton.textContent = isPaused ? "Resume" : "Pause";
            pauseButton.setAttribute("aria-pressed", String(isPaused));

            if (isPaused) {
                clearInterval(speechInterval);
                speechInterval = null;
                window.speechSynthesis.cancel();
                if (animationFrameId !== null) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                if (victoryTimeout !== null) {
                    clearTimeout(victoryTimeout);
                    victoryTimeout = null;
                    victoryTimeRemaining = Math.max(0, victoryDeadline - Date.now());
                }
                speakAnnouncement("遊戲暫停");
                return;
            }

            previousFrameTime = 0;
            speakAnnouncement("遊戲繼續");
            startPronunciationLoop();
            scheduleVictoryTransition();
            if (animationFrameId === null) animationFrameId = requestAnimationFrame(gameLoop);
        }

        async function loadCSV(level) {
            try {
                const response = await fetch(`level${level}.csv`);
                if (!response.ok) throw new Error("File not found");
                const data = await response.text();
                // 假設 CSV 是以逗號或換行分隔的單字
                return data.split(/[\n,]/).map(w => w.trim()).filter(w => w.length > 0);
            } catch (e) {
                console.warn(`CSV level${level}.csv 讀取失敗，使用備用字庫`);
                return fallbackWords[level] || fallbackWords[1];
            }
        }

        async function setStage(levelNumber) {
            isGameStarted = false;
            currentStage = levelNumber;
            document.querySelectorAll(".stage-btn").forEach((btn, idx) => {
                btn.classList.toggle("active", idx === (levelNumber - 1));
            });
            
            clearInterval(speechInterval);
            speechInterval = null;
            window.speechSynthesis.cancel();
            currentLevelWords = await loadCSV(currentStage);
            
            // 打亂陣列排列
            currentLevelWords.sort(() => Math.random() - 0.5);
            remainingWords = [...currentLevelWords];

            // 重置狀態
            kartOffset = 0;
            steeringVelocity = 0;
            steeringDirection = 0;
            kartVerticalOffset = 0;
            kartVerticalVelocity = 0;
            elapsedGameSeconds = 0;
            elapsedTime.textContent = "T: 0s";
            dkKart.style.setProperty("--kart-offset", "0px");
            dkKart.style.bottom = `${baseKartY}px`;
            totalClicks = 0;
            correctClicks = 0;
            incorrectClicks = 0;
            targetVelocity = 0;
            kartVelocity = 0;
            activeObstacles.forEach(obs => obs.element.remove());
            activeObstacles = [];
            accuracyEl.textContent = "100";
            correctCountEl.textContent = "0";
            incorrectCountEl.textContent = "0";

            renderWordBoard();
            isGameStarted = true;
            speakAnnouncement("遊戲開始");
            pickNextWord();
        }

        function renderWordBoard() {
            wordBoard.innerHTML = "";
            currentLevelWords.forEach(word => {
                const square = document.createElement("div");
                square.className = "yellow-square";
                square.textContent = word;
                square.onclick = () => handleWordClick(word, square);
                wordBoard.appendChild(square);
            });
        }

        function pickNextWord() {
            if (remainingWords.length === 0) {
                clearInterval(speechInterval);
                triggerVictory();
                return;
            }
            // 從剩下的字隨機抽一個
            const randomIndex = Math.floor(Math.random() * remainingWords.length);
            targetWord = remainingWords[randomIndex];
            startPronunciationLoop();
        }

        function handleWordClick(clickedWord, squareElement) {
            if (isPaused || !targetWord) return;
            totalClicks++;

            if (clickedWord === targetWord) {
                // 正確
                playSound(true);
                correctClicks++;
                correctCountEl.textContent = correctClicks;
                
                // 加速賽車
                targetVelocity += 15; // 點擊成功給予較大速度補償
                if (targetVelocity > maxVelocity) targetVelocity = maxVelocity;
                kartVerticalVelocity = kartVerticalImpulse;
                statusText.innerHTML = "";
                flameEffect.style.opacity = (targetVelocity / maxVelocity);

                // 從剩餘清單移除並隱藏方塊
                remainingWords = remainingWords.filter(w => w !== targetWord);
                squareElement.classList.add("hidden");

                pickNextWord();
            } else {
                // 錯誤
                playSound(false);
                incorrectClicks++;
                incorrectCountEl.textContent = incorrectClicks;
                kartVerticalVelocity = -kartVerticalImpulse;
                
                // 減速懲罰
                targetVelocity *= 0.25; 
                flameEffect.style.opacity = "0";
                statusText.innerHTML = `<span class="stall-warning">🛑 答錯減速!</span>`;
            }

            // 更新準確率
            const acc = Math.round((correctClicks / totalClicks) * 100);
            accuracyEl.textContent = isNaN(acc) ? 100 : acc;
        }

        // 賽車轉向邏輯
        function applySteeringImpulse(direction) {
            steeringVelocity = Math.max(-maxSteeringVelocity, Math.min(maxSteeringVelocity, steeringVelocity + direction * steeringImpulse));
        }

        function updateKartSteering(deltaSeconds) {
            if (steeringDirection) {
                steeringVelocity = Math.max(-maxSteeringVelocity, Math.min(maxSteeringVelocity, steeringVelocity + steeringDirection * steeringAcceleration * deltaSeconds));
            } else {
                const friction = steeringFriction * deltaSeconds;
                steeringVelocity = Math.abs(steeringVelocity) <= friction ? 0 : steeringVelocity - Math.sign(steeringVelocity) * friction;
            }
            const maxOffset = Math.max(0, (trackScene.clientWidth - dkKart.offsetWidth) / 2 - 8);
            kartOffset = Math.max(-maxOffset, Math.min(maxOffset, kartOffset + steeringVelocity * deltaSeconds));
            if ((kartOffset === -maxOffset && steeringVelocity < 0) || (kartOffset === maxOffset && steeringVelocity > 0)) {
                steeringVelocity = 0;
            }
            dkKart.style.setProperty("--kart-offset", `${kartOffset}px`);
        }

        function clickSteering(direction, control) {
            if (isPaused) return;
            control.classList.add("active");
            setTimeout(() => control.classList.remove("active"), 150);
            applySteeringImpulse(direction);
        }

        steerLeft.addEventListener("click", () => clickSteering(-1, steerLeft));
        steerRight.addEventListener("click", () => clickSteering(1, steerRight));

        function spawnObstacle() {
            const emojis = ["🍄", "🐢", "🍌", "🪨", "🪙"];
            const ob = document.createElement("div");
            ob.className = "obstacle";
            ob.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            const trackWidth = 400; 
            const xPos = (Math.random() * trackWidth) + 20; 
            ob.style.left = `${xPos}px`;
            ob.style.top = `-100px`; 
            obstaclesLayer.appendChild(ob);
            activeObstacles.push({ element: ob, y: -100, x: xPos });
        }

        function gameLoop(timestamp) {
            if (isPaused) {
                animationFrameId = null;
                return;
            }
            const rawDeltaSeconds = previousFrameTime ? (timestamp - previousFrameTime) / 1000 : 0;
            const deltaSeconds = Math.min(rawDeltaSeconds, 0.05);
            previousFrameTime = timestamp;
            if (isGameStarted) elapsedGameSeconds += rawDeltaSeconds;
            const elapsedWholeSeconds = Math.floor(elapsedGameSeconds);
            if (elapsedTime.textContent !== `T: ${elapsedWholeSeconds}s`) {
                elapsedTime.textContent = `T: ${elapsedWholeSeconds}s`;
            }
            updateKartSteering(deltaSeconds);

            kartVerticalVelocity += (-kartVerticalSpring * kartVerticalOffset - kartVerticalDamping * kartVerticalVelocity) * deltaSeconds;
            kartVerticalOffset += kartVerticalVelocity * deltaSeconds;
            if (Math.abs(kartVerticalOffset) < 0.1 && Math.abs(kartVerticalVelocity) < 0.1) {
                kartVerticalOffset = 0;
                kartVerticalVelocity = 0;
            }

            targetVelocity -= 0.08; // 自然減速稍微放緩，因為點擊頻率比打字低
            if (targetVelocity < 0) targetVelocity = 0;

            kartVelocity += (targetVelocity - kartVelocity) * 0.08; 

            if (kartVelocity > 0.1) {
                roadOffset += kartVelocity;
                roadLines.style.transform = `translateX(-50%) translateY(${roadOffset % 160}px)`;
                let visualY = baseKartY + (kartVelocity * 1.5) + kartVerticalOffset;
                dkKart.style.bottom = `${visualY}px`;
                flameEffect.style.opacity = kartVelocity / maxVelocity;

                if (Math.random() < 0.03 && kartVelocity > 8) spawnObstacle();
            } else {
                dkKart.style.bottom = `${baseKartY + kartVerticalOffset}px`;
                flameEffect.style.opacity = "0";
            }

            for (let i = activeObstacles.length - 1; i >= 0; i--) {
                let obs = activeObstacles[i];
                obs.y += kartVelocity * 1.2; 
                obs.element.style.top = `${obs.y}px`;
                if (obs.y > 1000) {
                    obs.element.remove();
                    activeObstacles.splice(i, 1);
                }
            }
            const speed = Math.round(kartVelocity * 7);
            speedMeter.setAttribute("aria-valuenow", Math.min(speed, maxVelocity * 7));
            speedMeter.setAttribute("aria-valuetext", `${speed} km/h`);
            const speedRatio = Math.min(kartVelocity / maxVelocity, 1);
            const verticalDisplacementRatio = Math.min(Math.abs(kartVerticalOffset) / 40, 1);
            const meterColorRatio = Math.max(speedRatio, verticalDisplacementRatio);
            const meterBaseColor = [51, 51, 51];
            const darkGold = [184, 134, 11];
            const meterBackground = meterBaseColor.map((start, index) => Math.round(start + (darkGold[index] - start) * meterColorRatio));
            speedMeter.style.backgroundColor = `rgb(${meterBackground.join(", ")})`;
            const paleGold = [255, 244, 204];
            const gold = paleGold.map((start, index) => Math.round(start + (darkGold[index] - start) * speedRatio));
            speedMeterFill.style.width = `${speedRatio * 100}%`;
            speedMeterFill.style.backgroundColor = `rgb(${gold.join(", ")})`;
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function triggerVictory() {
            targetVelocity = maxVelocity * 1.5;
            congratsMsg.classList.add("show");
            victoryTimeRemaining = 3000;
            scheduleVictoryTransition();
        }

        // 初始化
        setStage(1);
        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
